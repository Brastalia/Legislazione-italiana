name: Sincronizza catalogo collezioni Normattiva
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalogo-normattiva
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scarica catalogo ufficiale
        run: python scripts/sincronizza_collezioni.py
      - name: Pubblica catalogo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dati/collezioni-normattiva.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna catalogo collezioni Normattiva"
            git pull --rebase
            git push
          fi
