name: Importazione automatica Normattiva (catalogo atti)
on:
  schedule:
    - cron: '17 4 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: normattiva-importazione
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scarica e indicizza collezione ufficiale
        env:
          COLLECTION_NAME: Codici
          MAX_DOWNLOAD_MB: '80'
        run: python scripts/importa_automaticamente.py
      - name: Salva indice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dati/importazioni/
          if ! git diff --cached --quiet; then
            git commit -m "Importazione automatica catalogo Codici Normattiva"
            git pull --rebase
            git push
          fi
